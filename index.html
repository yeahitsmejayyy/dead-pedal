<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dead-pedal — M5</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #0b0d10; overflow: hidden; }
      #scene { display: block; width: 100vw; height: 100vh; }
      #keys {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: #7b8794;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
      }
      #keys b { color: #d8dee6; font-weight: 600; }

      /* ── HUD ─────────────────────────────────────────────────────────── */
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 260px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8dee6;
        pointer-events: none;
        user-select: none;
      }
      .hud-label {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #8b95a3;
        margin-bottom: 5px;
      }
      .hud-health { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center; }
      .hud-label, .hud-track { grid-column: 1; }
      .hud-value {
        grid-column: 2;
        grid-row: 1 / span 2;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .hud-track {
        height: 12px;
        background: #11151b;
        border: 1px solid #2b3440;
        border-radius: 2px;
        overflow: hidden;
      }
      .hud-fill {
        height: 100%;
        width: 100%;
        background: #4ade80;
        transition: width 90ms linear, background 180ms linear;
      }
      /* Only the border pulses: a bar that flashes is harder to read, not more
         urgent, and this has to stay legible at the moment it matters most. */
      #hud.is-critical .hud-track { animation: hud-warn 0.75s ease-in-out infinite; }
      @keyframes hud-warn {
        0%, 100% { border-color: #2b3440; }
        50%      { border-color: #ef4444; }
      }
      .hud-down {
        display: none;
        margin-top: 8px;
        color: #ef4444;
        letter-spacing: 0.08em;
      }
      .tp-dfwv { z-index: 10; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="keys">
      <div><b>W&nbsp;S</b> throttle / brake &nbsp;·&nbsp; <b>A&nbsp;D</b> steer</div>
      <div><b>Space</b> handbrake &nbsp;·&nbsp; <b>C</b> look back &nbsp;·&nbsp; <b>R</b> reset</div>
      <div><b>J</b> / left&nbsp;click machine gun &nbsp;·&nbsp; <b>K</b> / right&nbsp;click special &nbsp;·&nbsp; <b>L</b> cycle special</div>
      <div><b>T</b> next target &nbsp;<i>(homing missile only)</i></div>
      <div>gamepad: triggers, left stick, <b>A</b> handbrake, <b>X</b> gun, <b>Y</b> special, <b>RB</b> cycle, <b>LB</b> target</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
