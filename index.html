<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dead-pedal — M5</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #0b0d10; overflow: hidden; }
      #scene { display: block; width: 100vw; height: 100vh; }

      /* ── HUD ─────────────────────────────────────────────────────────── */
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 260px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8dee6;
        pointer-events: none;
        user-select: none;
      }
      .hud-stack { display: grid; gap: 14px; }
      .hud-label {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #8b95a3;
        margin-bottom: 5px;
      }
      .hud-key {
        display: inline-block;
        margin-left: 4px;
        padding: 0 4px;
        border: 1px solid #333d4a;
        border-radius: 2px;
        color: #aab4c0;
        font-weight: 600;
      }

      /* Health and ammo share one gauge shape, so the column reads as one instrument
         rather than two designs stacked. */
      .hud-gauge { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center; }
      .hud-label, .hud-track { grid-column: 1; }
      .hud-value {
        grid-column: 2;
        grid-row: 1 / span 2;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .hud-track {
        height: 12px;
        background: #11151b;
        border: 1px solid #2b3440;
        border-radius: 2px;
        overflow: hidden;
      }
      .hud-fill {
        height: 100%;
        width: 100%;
        background: #4ade80;
        transition: width 90ms linear, background 180ms linear;
      }
      /* Ammo is deliberately NOT on the health ramp. A colour that means "hurt" must
         not also mean "low on bullets" — steel, with one step to amber at 15%. Thinner
         track and a smaller numeral, so health stays the loudest thing in the column. */
      .hud-gauge--ammo .hud-track { height: 8px; }
      .hud-gauge--ammo .hud-value { font-size: 16px; color: #aab4c0; }
      .hud-fill--ammo { background: #6b7784; }
      .hud-fill--ammo.is-low { background: #facc15; }

      /* ── special ─────────────────────────────────────────────────────── */
      .hud-special {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: center;
        gap: 0 8px;
        padding: 2px 0;
        color: #66707d;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      /* The icon is the weapon's outline in the crate's colour, and it is
         always lit — it is a legend, not a cursor. Selection is carried by
         brightness and a rule instead, so the two facts never compete for the
         same pixel. */
      .hud-icon { display: block; opacity: 0.55; }
      .hud-icon svg { display: block; width: 26px; height: 12px; }
      .hud-special.is-selected { color: #e8edf3; }
      .hud-special.is-selected .hud-icon { opacity: 1; }
      .hud-special.is-empty { color: #4a5461; }
      .hud-special.is-empty .hud-special-ammo { color: #ef4444; }
      /* The lock line reserves its row whether or not it has text. A block that grows
         and shrinks under three weapon rows moves the whole column while you read it. */
      .hud-locked {
        min-height: 15px;
        margin-top: 5px;
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #facc15;
      }
      .hud-locked.is-locked { color: #ef4444; }

      /* Only the border pulses: a bar that flashes is harder to read, not more
         urgent, and this has to stay legible at the moment it matters most. */
      #hud.is-critical .hud-gauge:first-child .hud-track { animation: hud-warn 0.75s ease-in-out infinite; }
      @keyframes hud-warn {
        0%, 100% { border-color: #2b3440; }
        50%      { border-color: #ef4444; }
      }
      .hud-down { display: none; color: #ef4444; letter-spacing: 0.08em; }
      #hud.is-down .hud-down { display: block; }
      /* Countdown: the readouts are live, the car is not. Dimmed rather than hidden —
         what you are holding is worth reading before the flag drops. */
      #hud.is-frozen .hud-stack { opacity: 0.45; }

      /* ── round state ─────────────────────────────────────────────────── */
      /* Tweakpane parks top-right and is ~256px wide plus margin, so at 1280 the play
         area is 0..1010 and the clock centres in THAT, not in the viewport. The 270px
         is the one number in this file that tracks the debug panel. */
      .hud-round {
        position: fixed;
        top: 14px;
        left: 0;
        right: 270px;
        margin: 0 auto;
        width: max-content;
        text-align: center;
      }
      .hud-clock {
        font-size: 34px;
        line-height: 1;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        color: #e8edf3;
      }
      .hud-clock.is-urgent { color: #ef4444; }
      .hud-kills {
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #8b95a3;
      }
      .hud-kills.is-behind { color: #facc15; }
      .hud-kills.is-hidden { visibility: hidden; }

      .hud-count {
        position: fixed;
        inset: 0 270px 0 0;
        display: grid;
        place-items: center;
        font-size: 108px;
        line-height: 1;
        font-weight: 600;
        color: #e8edf3;
        opacity: 0;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.85);
      }
      .hud-count.is-beat { animation: hud-beat 1s ease-out forwards; }
      .hud-count.is-go { animation: hud-go 0.8s ease-out forwards; color: #4ade80; }
      @keyframes hud-beat {
        0%   { opacity: 0; transform: scale(1.55); }
        18%  { opacity: 1; transform: scale(1); }
        72%  { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.94); }
      }
      @keyframes hud-go {
        0%   { opacity: 1; transform: scale(0.85); }
        100% { opacity: 0; transform: scale(1.6); }
      }

      .hud-board {
        position: fixed;
        inset: 0 270px 0 0;
        display: none;
        place-items: center;
        align-content: center;
        gap: 18px;
      }
      .hud-board.is-shown { display: grid; }
      .hud-board-title {
        font-size: 38px;
        letter-spacing: 0.12em;
        color: #4ade80;
      }
      .hud-board-title.is-draw { color: #facc15; }
      .hud-board-rows {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 230px;
        padding: 15px 18px;
        background: rgba(9, 12, 16, 0.82);
        border: 1px solid #2b3440;
        border-radius: 3px;
      }
      .hud-board-row {
        display: grid;
        grid-template-columns: 8px 1fr auto;
        align-items: center;
        gap: 0 14px;
        font-size: 14px;
        letter-spacing: 0.12em;
        color: #6b7784;
        font-variant-numeric: tabular-nums;
      }
      .hud-board-row i { height: 8px; border-radius: 1px; opacity: 0.55; }
      .hud-board-row.is-top { color: #e8edf3; }
      .hud-board-row.is-top i { opacity: 1; }
      .hud-again {
        pointer-events: auto;
        margin-top: 14px;
        justify-self: center;
        padding: 8px 18px;
        font: inherit;
        letter-spacing: 0.14em;
        color: #d8dee6;
        background: #11151b;
        border: 1px solid #2b3440;
        border-radius: 3px;
        cursor: pointer;
      }
      .hud-again b { color: #8b95a3; font-weight: 600; margin-left: 6px; }
      .hud-again:hover { border-color: #4ade80; color: #e8edf3; }
      .hud-again:active { transform: translateY(1px); }
      .hud-again:focus-visible { outline: 1px solid #4ade80; outline-offset: 2px; }

      /* Paused. Deliberately not a full-screen scrim — you should still be able
         to see the frame you stopped on. */
      .hud-paused {
        display: none;
        position: fixed;
        inset: 0;
        place-content: center;
        justify-items: center;
        text-align: center;
        background: rgba(7, 9, 12, 0.45);
      }
      .hud-paused.is-shown { display: grid; }
      .hud-paused-word {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #e8edf3;
        text-indent: 0.22em;
      }
      .hud-paused-hint { margin-top: 10px; font-size: 12px; color: #8b95a3; }
      .hud-paused-hint b { color: #d8dee6; }
      #hud.is-paused .hud-stack,
      #hud.is-paused .hud-round,
      #hud.is-paused .hud-radar { opacity: 0.35; transition: opacity 140ms linear; }

      /* ── radar ───────────────────────────────────────────────────────── */
      /* Bottom-left, clear of the debug panel's whole right-hand column. */
      .hud-radar { position: fixed; left: 16px; bottom: 16px; line-height: 0; }


      /* ── title screen ────────────────────────────────────────────────── */
      /* Sits over everything including the debug panel: while it is up, it owns
         the screen. Hidden by default so a `?nomenu=1` boot never flashes it. */
      #title {
        position: fixed;
        inset: 0;
        /* Above #select, deliberately. The select screen is revealed underneath
           the title as the title fades, which is what keeps the arena from
           flashing between the two menus. Equal z-index would let #select win
           on DOM order and the crossfade would run backwards. */
        z-index: 21;
        display: none;
        place-items: center;
        isolation: isolate;
        /* Fallback, and it has to look deliberate: the backdrop art is a
           separate file that may not exist yet, and a 404 must degrade to
           something on-brand rather than to a white page. Burnt sky over night
           black, which is the cover's own value structure. */
        background: radial-gradient(125% 90% at 50% 0%, #7a2d10 0%, #2a1208 44%, #0b0d10 100%);
      }
      #title.is-shown { display: grid; }
      /* The art, on its own layer so the gradient above shows through when the
         file is missing. `cover` crops rather than letterboxes, which is why the
         art is generated with a safe area. */
      #title::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background: url('gfx/start-menu.png') center / cover no-repeat;
      }
      /* Legibility scrim. Menu text sits over whatever the generator produced,
         and "whatever it produced" is not a contrast guarantee. */
      #title::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        /* Two layers. The radial buys local contrast directly behind the plate,
           which is where the art is busiest — the tagline sits over a fence line
           and was unreadable on the first pass. The linear keeps the bottom edge
           dark so the button and hint stay solid however the image is cropped. */
        background:
          radial-gradient(58% 42% at 50% 56%, rgba(7, 9, 12, 0.72) 0%, rgba(7, 9, 12, 0.34) 55%, rgba(7, 9, 12, 0) 100%),
          linear-gradient(to bottom, rgba(7, 9, 12, 0.42) 0%, rgba(7, 9, 12, 0.16) 30%, rgba(7, 9, 12, 0.55) 74%, rgba(7, 9, 12, 0.9) 100%);
      }

      .title-plate {
        display: grid;
        justify-items: center;
        gap: 0;
        padding: 0 24px;
        text-align: center;
      }

      /* ── the outro ────────────────────────────────────────────────────
         Two seconds, cut against `menu-start.ogg`. The starter grinds while the
         plate clears, the engine catches as the zoom accelerates, and the idle
         carries the last of the fade.

         Every layer uses `forwards` so nothing snaps back to its start pose in
         the frame between the animation ending and the overlay being hidden. */
      #title.is-leaving { pointer-events: none; }

      /* The whole screen pulls in and dissolves, revealing the arena that has
         been rendering behind this the entire time. Late start: the plate has
         to clear first or the zoom just drags the UI along with it. */
      #title.is-leaving {
        animation: title-out 0.9s cubic-bezier(0.4, 0, 0.85, 0.35) forwards;
      }
      @keyframes title-out {
        0%, 30%  { transform: scale(1); opacity: 1; }
        100%     { transform: scale(1.22); opacity: 0; }
      }

      /* Tagline, button and hint drop away first, staggered so they read as a
         sequence rather than one block leaving. */
      #title.is-leaving .title-tagline { animation: title-drop 0.3s ease-in forwards; }
      #title.is-leaving .title-start   { animation: title-drop 0.3s ease-in 0.05s forwards; }
      #title.is-leaving .title-hint    { animation: title-drop 0.3s ease-in 0.1s forwards; }
      @keyframes title-drop {
        to { opacity: 0; transform: translateY(14px); }
      }

      /* The button flattens and blows its glow out on the way. */
      #title.is-leaving .title-start {
        background: linear-gradient(180deg, #ffd9a8 0%, #ffb055 100%);
        color: #1a0f06;
        box-shadow: inset 0 0 0 2px #ffd9a8, 0 0 46px rgba(255, 170, 60, 0.75);
      }

      /* The wordmark scales past the frame. `--mark-from` is written by
         title.ts from the live computed transform, so the pull-away continues
         from wherever the breathe loop was rather than snapping to 1. */
      #title.is-leaving .title-markwrap {
        animation: title-mark-out 0.6s cubic-bezier(0.35, 0, 0.7, 0.25) 0.12s forwards;
      }
      /* No glint mid-exit. */
      #title.is-leaving .title-markwrap::after { animation: none; opacity: 0; }
      @keyframes title-mark-out {
        from { transform: scale(var(--mark-from, 1)); opacity: 1; }
        to   { transform: scale(1.55); opacity: 0; }
      }

      /* The fires keep burning while everything else leaves. */
      #title.is-leaving .title-embers { animation: title-embers-out 0.7s ease-in 0.2s forwards; }
      @keyframes title-embers-out { to { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        #title.is-leaving,
        #title.is-leaving .title-markwrap,
        #title.is-leaving .title-tagline,
        #title.is-leaving .title-start,
        #title.is-leaving .title-hint,
        #title.is-leaving .title-embers { animation: none; }
      }

      /* ── the city is on fire ──────────────────────────────────────────
         Three soft warm pools sitting over the skyline, roughly where the
         backdrop's smoke columns rise from, so the light has a source in the
         picture rather than floating. `screen` blending adds light instead of
         painting a peach disc over the art.

         They live between the artwork and the legibility scrim on purpose: the
         scrim knocks them back slightly, which is what stops them competing
         with the wordmark. Radial gradients rather than a blur filter — same
         falloff, and no per-frame blur on a full-screen layer. */
      .title-embers {
        position: absolute;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      .title-ember {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
        background: radial-gradient(
          circle,
          rgba(255, 162, 54, 0.62) 0%,
          rgba(255, 108, 24, 0.28) 44%,
          rgba(255, 70, 0, 0) 74%
        );
        animation: title-ember 9s ease-in-out infinite alternate;
        will-change: opacity, transform;
      }
      /* Staggered and prime-ish durations so the three never pulse together,
         which is what would make it read as a CSS animation. */
      .title-ember--a { left: 12%; top: 22%; width: 38vw; height: 38vw; animation-duration: 8.5s; }
      .title-ember--b { left: 44%; top: 17%; width: 30vw; height: 30vw; animation-duration: 11.5s; animation-delay: -3.2s; }
      .title-ember--c { left: 70%; top: 24%; width: 34vw; height: 34vw; animation-duration: 14s; animation-delay: -6.7s; }

      @keyframes title-ember {
        from { opacity: 0.32; transform: scale(0.94); }
        to   { opacity: 0.78; transform: scale(1.12); }
      }

      /* ── distant shelling ─────────────────────────────────────────────
         Flashes along the skyline. Mostly nothing: each one is dark for ~92% of
         its cycle, then pops. The double-tap at 93% and 97% is the point — a
         single clean fade reads as a blinking div, whereas a hard flash with a
         dimmer secondary behind it reads as a detonation and its echo.

         Three of them on 9s, 13s and 17s with negative delays. Coprime-ish
         durations mean the pattern does not visibly repeat, which is the whole
         job: the moment two flashes fire together twice, the eye catches the
         loop. */
      .title-flash {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        mix-blend-mode: screen;
        background: radial-gradient(
          circle,
          rgba(255, 240, 210, 0.95) 0%,
          rgba(255, 170, 60, 0.55) 28%,
          rgba(255, 90, 10, 0) 68%
        );
        animation: title-flash 9s linear infinite;
        will-change: opacity, transform;
      }
      .title-flash--a { left: 15%; top: 30%; width: 9vw; height: 9vw; }
      .title-flash--b { left: 56%; top: 26%; width: 7vw; height: 7vw; animation-duration: 13s; animation-delay: -4.5s; }
      .title-flash--c { left: 78%; top: 32%; width: 8vw; height: 8vw; animation-duration: 17s; animation-delay: -11s; }

      @keyframes title-flash {
        0%, 92%   { opacity: 0; transform: scale(0.85); }
        93%       { opacity: 0.95; transform: scale(1); }
        95%       { opacity: 0.22; transform: scale(1.06); }
        97%       { opacity: 0.6; transform: scale(1.03); }
        100%      { opacity: 0; transform: scale(1.14); }
      }

      /* Smoke, rising off the same skyline. Dark rather than light: the sky
         behind is the brightest thing in the picture, so smoke reads by
         occluding it. Long, slow and low-opacity — this is meant to be noticed
         only if you stop and look for it. */
      .title-smoke {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(circle, rgba(24, 18, 15, 0.6) 0%, rgba(24, 18, 15, 0.28) 45%, rgba(24, 18, 15, 0) 72%);
        animation: title-smoke 17s linear infinite;
        will-change: opacity, transform;
      }
      .title-smoke--a { left: 20%; top: 26%; width: 16vw; height: 16vw; }
      .title-smoke--b { left: 62%; top: 22%; width: 13vw; height: 13vw; animation-duration: 23s; animation-delay: -9s; }

      @keyframes title-smoke {
        0%   { opacity: 0; transform: translateY(18px) scale(0.82); }
        22%  { opacity: 0.3; }
        70%  { opacity: 0.18; }
        100% { opacity: 0; transform: translateY(-110px) scale(1.55); }
      }

      /* The wordmark breathes on a 3s cycle. Amplitude stays at 2.8%: speed was
         what was missing both times it got tuned, and scaling a 660px logo any
         harder starts softening its edges on a non-integer scale factor. */
      @keyframes title-breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.028); }
      }

      /* Anything that moves, stops. A slowly pulsing full-screen glow is exactly
         what this setting exists for. */
      @media (prefers-reduced-motion: reduce) {
        .title-ember { animation: none; opacity: 0.5; }
        .title-flash { animation: none; opacity: 0; }
        .title-smoke { animation: none; opacity: 0.12; }
        .title-markwrap { animation: none; }
        .title-markwrap::after { animation: none; opacity: 0; }
      }

      /* The wordmark, as artwork.
         `width` and `height` are on the tag as well as in CSS so the browser
         reserves the right box before the 786KB PNG arrives — otherwise the
         tagline and button jump down the moment it loads, which is the first
         thing anyone sees. The art carries its own dark keyline and glow, so the
         only shadow here is a soft one for separation from the sky. */
      /* The wrapper carries the scale and hosts the shine; the img is only
         pixels. They have to be separate elements: the shine is masked to the
         logo's own alpha, and a mask on a transformed element would be dragged
         around by that transform. */
      .title-markwrap {
        position: relative;
        display: block;
        width: min(74vw, 660px);
        animation: title-breathe 3s ease-in-out infinite;
        will-change: transform;
      }
      .title-mark {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.72));
      }

      /* A glint travelling across the metal, roughly every eight seconds.
         MASKED TO THE LOGO'S ALPHA, which is the whole trick — unmasked, the
         highlight sweeps the transparent gaps between the letters too and reads
         as a pale rectangle passing over the screen rather than as light
         catching a raised edge.
         The gradient's background-position animates while the element itself
         stays put. Translating the element would drag the mask with it and
         nothing would appear to move at all.

         Alpha is 0.58, not the 0.85 it started at. Pinned at peak, the higher
         value blew out the gas mask — and that mask is the centre of the brand,
         so a glint that erases it for a moment is a glint doing harm. */
      .title-markwrap::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(
          105deg,
          rgba(255, 244, 220, 0) 42%,
          rgba(255, 244, 220, 0.58) 50%,
          rgba(255, 244, 220, 0) 58%
        );
        background-size: 300% 100%;
        background-repeat: no-repeat;
        -webkit-mask: url('brand/dead-pedal-logo.png') center / contain no-repeat;
        mask: url('brand/dead-pedal-logo.png') center / contain no-repeat;
        mix-blend-mode: screen;
        animation: title-shine 8s ease-in-out infinite;
      }
      /* Dark for most of the cycle, then one pass. The sweep occupies the last
         18% of the loop, so it reads as an occasional event rather than as a
         thing that is always happening. */
      @keyframes title-shine {
        0%, 82%  { background-position: 130% 0; opacity: 0; }
        84%      { opacity: 1; }
        98%      { background-position: -30% 0; opacity: 1; }
        100%     { background-position: -30% 0; opacity: 0; }
      }

      .title-tagline {
        margin: 18px 0 0;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #aab4c0;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      }

      /* START, as a cut steel plate rather than a rounded rectangle.
         Three things carry the brand, and none of them is decoration:

         The CORNERS are chamfered with clip-path, not rounded. A radius reads as
         software; a 45-degree cut reads as something sheared off a sheet. It is
         also the one change that stops this looking like every other button on
         the internet, which was the actual complaint.

         The EDGE is boost orange #ff8c1a — the same hex the ramp chevrons use in
         the arena and the same warm the wordmark glows with. The palette is
         already decided; the button just joins it.

         The FACE is dark and the fill only arrives on hover. A menu with one
         action does not need to shout at rest, and it gives the hover somewhere
         to go. */
      .menu-button,
      .title-start {
        position: relative;
        margin-top: 30px;
        padding: 16px 58px;
        font: 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #ffd9a8;
        background:
          linear-gradient(180deg, rgba(255, 140, 26, 0.16) 0%, rgba(255, 140, 26, 0.04) 46%, rgba(0, 0, 0, 0.3) 100%),
          linear-gradient(180deg, #2b2019 0%, #171210 100%);
        border: 0;
        border-radius: 0;
        cursor: pointer;
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
        /* The border has to be drawn, not declared: `border` would square off
           the corners the clip-path just cut. An inset ring follows the clip. */
        box-shadow:
          inset 0 0 0 2px #ff8c1a,
          inset 0 1px 0 rgba(255, 214, 160, 0.35),
          0 0 22px rgba(255, 140, 26, 0.22);
        text-shadow: 0 0 14px rgba(255, 140, 26, 0.55);
        transition:
          color 140ms linear,
          background 140ms linear,
          box-shadow 140ms linear,
          transform 70ms linear;
      }
      .menu-button:hover,
      .title-start:hover {
        color: #1a0f06;
        background: linear-gradient(180deg, #ffb055 0%, #ff8c1a 55%, #e0700c 100%);
        box-shadow:
          inset 0 0 0 2px #ffd9a8,
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          0 0 34px rgba(255, 140, 26, 0.5);
        text-shadow: none;
      }
      .menu-button:active,
      .title-start:active { transform: translateY(2px); }
      /* Chamfered corners make an outline ring look wrong, so focus reuses the
         hover treatment plus a wider halo — visible without fighting the shape. */
      .menu-button:focus-visible,
      .title-start:focus-visible {
        outline: none;
        box-shadow:
          inset 0 0 0 2px #ffd9a8,
          0 0 0 3px rgba(255, 140, 26, 0.4),
          0 0 34px rgba(255, 140, 26, 0.45);
      }

      .title-hint {
        margin: 16px 0 0;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        color: #8b95a3;
      }
      .title-hint b { color: #d8dee6; font-weight: 600; }

      /* The HUD belongs to the match, not to the menus in front of it. */
      body.is-title #hud,
      body.is-select #hud { display: none; }

      /* ── vehicle select ───────────────────────────────────────────────
         Same shell as the title: painted backdrop, legibility scrim, DOM on
         top. The one structural difference is the BAY — a hole in the middle of
         the layout where a live WebGL canvas sits, because the car you are
         choosing has to be the car you get. */
      #select {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        isolation: isolate;
        background: radial-gradient(125% 90% at 50% 0%, #6a2a12 0%, #24140b 44%, #0b0d10 100%);
      }
      /* Block, not grid. The screen is two anchored things now — the readout at
         the top and the car standing on the floor at the bottom — rather than
         one centred column, because the backdrop's garage floor is in the lower
         third and a centred car hovers above it. */
      #select.is-shown { display: block; animation: select-in 0.5s ease-out both; }
      @keyframes select-in {
        from { opacity: 0; transform: scale(1.04); }
        to   { opacity: 1; transform: scale(1); }
      }
      #select::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background: url('gfx/vehicle-select.png') center / cover no-repeat;
      }
      #select::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(62% 46% at 50% 52%, rgba(7, 9, 12, 0.55) 0%, rgba(7, 9, 12, 0.2) 60%, rgba(7, 9, 12, 0) 100%),
          linear-gradient(to bottom, rgba(7, 9, 12, 0.62) 0%, rgba(7, 9, 12, 0.2) 34%, rgba(7, 9, 12, 0.6) 76%, rgba(7, 9, 12, 0.92) 100%);
      }

      /* Region A, measured off the backdrop: the readout sits centred in the
         upper half of the garage rather than pinned to the top of the window,
         so it reads as being IN the room instead of floating over it. */
      .select-plate {
        position: absolute;
        top: 14%;
        height: 27%;
        left: 0;
        right: 0;
        display: grid;
        justify-items: center;
        align-content: center;
        padding: 0 24px;
        text-align: center;
      }
      .select-eyebrow {
        margin: 0 0 6px;
        font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #ff8c1a;
        text-shadow: 0 0 16px rgba(255, 140, 26, 0.5);
      }

      /* The bay is sized in vmin so the car keeps its presence on any window
         shape — a viewport-width box collapses the truck to a smear on a tall
         phone, and a fixed pixel box is enormous on a laptop. */
      /* Region B: the open floor between the barrels and the far wall. Placed
         by fraction rather than by an offset from the bottom, because the floor
         is a painted feature of the backdrop and stays put as the window grows.
         The 62vw cap keeps the bay near 2.1:1 against its own height — above
         about 2.18 the tallest vehicle gets fitted on height instead of width
         and the box truck starts rendering smaller than the sports car. */
      .select-stage {
        position: absolute;
        top: 46%;
        height: 40%;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 4px;
        width: min(62vw, 680px);
      }
      .select-bay {
        position: relative;
        height: 100%;
        min-width: 0;
      }
      .select-bay canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }
      /* A contact shadow, in CSS rather than in the scene.
         The preview renders on a transparent canvas with no ground plane, so
         the car had nothing to sit on and read as hovering over the garage
         floor in the backdrop. A real shadow would mean adding a receiver plane
         and a shadow-casting light to a second renderer for one ellipse. This
         is an ellipse. It sits behind the canvas, so the car occludes its own
         shadow the way it should. */
      .select-bay::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 1%;
        z-index: 0;
        width: 44%;
        height: 8%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(6, 4, 3, 0.72) 0%, rgba(6, 4, 3, 0.34) 52%, rgba(6, 4, 3, 0) 78%);
      }

      .select-arrow {
        padding: 18px 14px;
        font: 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #aab4c0;
        background: none;
        border: 0;
        cursor: pointer;
        transition: color 120ms linear, transform 80ms linear;
      }
      .select-arrow:hover { color: #ff8c1a; transform: scale(1.18); }
      .select-arrow:focus-visible { outline: 2px solid #ff8c1a; outline-offset: 2px; }

      .select-card { display: grid; justify-items: center; gap: 3px; margin-top: 8px; min-height: 74px; }
      .select-name {
        display: flex;
        align-items: center;
        gap: 10px;
        font: 19px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #e8edf3;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }
      .select-chip { width: 11px; height: 11px; border-radius: 2px; }
      .select-kind,
      .select-line,
      .select-treatment {
        margin: 0;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em;
        color: #aab4c0;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      }
      .select-kind {
        color: #ff8c1a;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .select-line { max-width: 60ch; white-space: nowrap; }
      .select-treatment { color: #7f8a97; letter-spacing: 0.18em; text-transform: uppercase; font-size: 10px; }

      .select-pips { display: flex; gap: 9px; margin-top: 12px; }
      .select-pip {
        width: 26px;
        height: 5px;
        padding: 0;
        border: 1px solid #4a5461;
        border-radius: 1px;
        background: none;
        cursor: pointer;
        transition: border-color 120ms linear, transform 80ms linear;
      }
      .select-pip:hover { transform: scaleY(1.6); }
      .select-pip.is-on { border-color: transparent; }
      .select-pip:focus-visible { outline: 2px solid #ff8c1a; outline-offset: 3px; }

      .select-go { margin-top: 18px; }
      .select-hint {
        margin: 14px 0 0;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        color: #8b95a3;
      }
      .select-hint b { color: #d8dee6; font-weight: 600; }

      /* Launch: the same grammar as the title outro so the two transitions feel
         like one system. Two seconds, cut against menu-start.ogg. */
      #select.is-leaving { pointer-events: none; animation: title-out 2s cubic-bezier(0.4, 0, 0.85, 0.35) forwards; }
      #select.is-leaving .select-eyebrow,
      #select.is-leaving .select-card,
      #select.is-leaving .select-pips,
      #select.is-leaving .select-hint { animation: title-drop 0.42s ease-in forwards; }
      #select.is-leaving .select-arrow { animation: title-drop 0.3s ease-in forwards; }
      #select.is-leaving .select-go {
        background: linear-gradient(180deg, #ffd9a8 0%, #ffb055 100%);
        color: #1a0f06;
        box-shadow: inset 0 0 0 2px #ffd9a8, 0 0 46px rgba(255, 170, 60, 0.75);
        animation: title-drop 0.42s ease-in 0.1s forwards;
      }
      /* The car keeps turning as everything leaves — it is the thing you chose,
         and it should be the last thing still moving. */
      #select.is-leaving .select-bay { animation: title-drop 0.8s ease-in 0.7s forwards; }

      @media (prefers-reduced-motion: reduce) {
        #select.is-shown { animation: none; }
        #select.is-leaving,
        #select.is-leaving .select-eyebrow,
        #select.is-leaving .select-card,
        #select.is-leaving .select-pips,
        #select.is-leaving .select-hint,
        #select.is-leaving .select-arrow,
        #select.is-leaving .select-go,
        #select.is-leaving .select-bay { animation: none; }
      }

      /* ── sound toggle ─────────────────────────────────────────────────
         Bottom-right, which is the one corner nothing else claims: the HUD is
         top-left, the radar bottom-left, the key legend along the bottom, and
         the debug panel down the whole right-hand side from the top.

         Above the menu overlays, because it has to be reachable ON the title
         screen — that is where a player decides whether they want sound at all,
         and it is the click that makes the audio context legal. */
      #sound {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 30;
      }

      .sound-button {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        padding: 0;
        color: #8b95a3;
        background: rgba(11, 13, 16, 0.55);
        border: 1px solid #2b3440;
        border-radius: 3px;
        cursor: pointer;
        transition: color 120ms linear, border-color 120ms linear, background 120ms linear;
      }
      .sound-button svg { width: 22px; height: 22px; }
      .sound-button svg path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* The speaker cone is the one filled shape, so the icon still reads as a
         speaker at 22px where thin outlines start to disappear. */
      .sound-button svg path:first-child { fill: currentColor; }

      .sound-button:hover { color: #d8dee6; border-color: #4a5461; background: rgba(11, 13, 16, 0.8); }
      .sound-button:focus-visible { outline: 2px solid #ff8c1a; outline-offset: 2px; }

      /* Off: waves hidden, cross shown. On: the reverse, lit in boost orange so
         the state is carried by colour AND by shape rather than colour alone. */
      .sound-wave { opacity: 0; }
      .sound-cross { opacity: 1; }
      #sound.is-on .sound-wave { opacity: 1; }
      #sound.is-on .sound-cross { opacity: 0; }
      #sound.is-on .sound-button { color: #ff8c1a; border-color: #6a4a22; }
      #sound.is-on .sound-button:hover { color: #ffb055; border-color: #ff8c1a; }

      .tp-dfwv { z-index: 10; }

      /* ── in-game menu ─────────────────────────────────────────────────
         The pause screen and the settings screen, which are one screen. Sits
         above everything including the debug panel (z-index 10), because a
         modal that something else can cover is not modal. */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8dee6;
      }
      #menu.is-shown { display: grid; }

      /* Blurred rather than merely darkened: the arena behind is a held frame,
         and blurring says "stopped" in a way a flat scrim does not. */
      .menu-scrim {
        position: absolute;
        inset: 0;
        background: rgba(6, 8, 11, 0.72);
        backdrop-filter: blur(3px);
      }

      .menu-panel {
        position: relative;
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        padding: 28px 30px 26px;
        background: linear-gradient(180deg, #14181d 0%, #0d1013 100%);
        box-shadow:
          inset 0 0 0 2px #2a323c,
          inset 0 1px 0 rgba(255, 214, 160, 0.08),
          0 24px 70px rgba(0, 0, 0, 0.7);
        /* Same chamfer as the START button, so the menu reads as part of the
           same set rather than a browser dialog that wandered in. */
        clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
      }

      .menu-title {
        margin: 0 0 20px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: #ffd9a8;
        text-shadow: 0 0 14px rgba(255, 140, 26, 0.45);
      }

      .menu-actions { display: grid; gap: 8px; }

      .menu-btn {
        width: 100%;
        padding: 13px 18px;
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-align: left;
        color: #d8dee6;
        background: rgba(20, 24, 29, 0.9);
        border: 0;
        box-shadow: inset 0 0 0 1px #2a323c;
        cursor: pointer;
        transition: color 120ms linear, background 120ms linear, box-shadow 120ms linear;
      }
      .menu-btn:hover {
        color: #ffd9a8;
        background: rgba(255, 140, 26, 0.1);
        box-shadow: inset 0 0 0 1px #6a4a22;
      }
      .menu-btn:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px #ff8c1a, 0 0 0 3px rgba(255, 140, 26, 0.28);
      }
      .menu-btn--primary {
        color: #1a0f06;
        background: linear-gradient(180deg, #ffb055 0%, #ff8c1a 55%, #e0700c 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .menu-btn--primary:hover {
        color: #1a0f06;
        background: linear-gradient(180deg, #ffc179 0%, #ff9c34 55%, #f07d16 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 0 26px rgba(255, 140, 26, 0.4);
      }
      .menu-btn--quiet { color: #8b95a3; }

      /* ── settings ─────────────────────────────────────────────────────── */
      .menu-settings {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid #232a33;
        display: grid;
        gap: 12px;
      }
      .menu-setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .menu-setting__label {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8b95a3;
      }
      .menu-setting__note {
        margin: -6px 0 0;
        font-size: 11px;
        color: #6b7784;
      }

      .menu-select,
      .menu-toggle {
        min-width: 132px;
        padding: 8px 12px;
        font: inherit;
        color: #d8dee6;
        background: rgba(11, 13, 16, 0.8);
        border: 1px solid #2a323c;
        border-radius: 0;
        cursor: pointer;
      }
      .menu-select:hover,
      .menu-toggle:hover { border-color: #4a5461; color: #ffd9a8; }
      .menu-select:focus-visible,
      .menu-toggle:focus-visible { outline: 2px solid #ff8c1a; outline-offset: 2px; }
      .menu-toggle[aria-pressed='true'] { color: #ff8c1a; border-color: #6a4a22; }

      /* ── controls list ────────────────────────────────────────────────── */
      .menu-controls { display: grid; gap: 20px; margin-bottom: 22px; }
      .menu-group__title {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #ff8c1a;
      }
      .menu-binds { margin: 0; display: grid; gap: 5px; }
      .menu-bind {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 4px 0;
        border-bottom: 1px solid rgba(35, 42, 51, 0.6);
      }
      .menu-bind__label { margin: 0; color: #aab4c0; }
      .menu-bind__note { color: #6b7784; font-style: italic; font-size: 11px; }
      .menu-bind__keys {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .menu-bind__keys kbd {
        display: inline-block;
        min-width: 24px;
        padding: 3px 7px;
        font: inherit;
        font-size: 11px;
        text-align: center;
        color: #d8dee6;
        background: #1a1f26;
        box-shadow: inset 0 0 0 1px #333c47, 0 1px 0 #0b0d10;
      }
      .menu-bind__or { color: #4a5461; font-size: 11px; }
      .menu-bind__pad {
        margin-left: 4px;
        padding: 3px 7px;
        font-size: 11px;
        color: #8b95a3;
        background: rgba(11, 13, 16, 0.6);
        box-shadow: inset 0 0 0 1px #232a33;
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-scrim { backdrop-filter: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="title"></div>
    <div id="select"></div>
    <div id="sound"></div>
    <div id="menu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
