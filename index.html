<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dead-pedal — M5</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #0b0d10; overflow: hidden; }
      #scene { display: block; width: 100vw; height: 100vh; }
      #keys {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: #7b8794;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        user-select: none;
      }
      #keys b { color: #d8dee6; font-weight: 600; }

      /* Replaces the existing "── HUD ──" block in index.html's <style>, and adds one
         override for #keys at the bottom. Everything above that block (`:root`, `body`,
         `#scene`, `#keys`, `.tp-dfwv`) stays exactly as it is. */

      /* ── HUD ─────────────────────────────────────────────────────────── */
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 260px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8dee6;
        pointer-events: none;
        user-select: none;
      }
      .hud-stack { display: grid; gap: 14px; }
      .hud-label {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #8b95a3;
        margin-bottom: 5px;
      }
      .hud-key {
        display: inline-block;
        margin-left: 4px;
        padding: 0 4px;
        border: 1px solid #333d4a;
        border-radius: 2px;
        color: #aab4c0;
        font-weight: 600;
      }

      /* Health and ammo share one gauge shape, so the column reads as one instrument
         rather than two designs stacked. */
      .hud-gauge { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center; }
      .hud-label, .hud-track { grid-column: 1; }
      .hud-value {
        grid-column: 2;
        grid-row: 1 / span 2;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .hud-track {
        height: 12px;
        background: #11151b;
        border: 1px solid #2b3440;
        border-radius: 2px;
        overflow: hidden;
      }
      .hud-fill {
        height: 100%;
        width: 100%;
        background: #4ade80;
        transition: width 90ms linear, background 180ms linear;
      }
      /* Ammo is deliberately NOT on the health ramp. A colour that means "hurt" must
         not also mean "low on bullets" — steel, with one step to amber at 15%. Thinner
         track and a smaller numeral, so health stays the loudest thing in the column. */
      .hud-gauge--ammo .hud-track { height: 8px; }
      .hud-gauge--ammo .hud-value { font-size: 16px; color: #aab4c0; }
      .hud-fill--ammo { background: #6b7784; }
      .hud-fill--ammo.is-low { background: #facc15; }

      /* ── special ─────────────────────────────────────────────────────── */
      .hud-special {
        display: grid;
        grid-template-columns: 6px 1fr auto;
        align-items: center;
        gap: 0 8px;
        padding: 2px 0;
        color: #66707d;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      /* The pip is the crate colour and is always lit — it is a legend, not a
         cursor. Selection is carried by brightness and a rule instead, so the
         two facts never compete for the same pixel. */
      .hud-pip { height: 7px; border-radius: 1px; opacity: 0.5; }
      .hud-special.is-selected { color: #e8edf3; }
      .hud-special.is-selected .hud-pip { opacity: 1; }
      .hud-special.is-empty { color: #4a5461; }
      .hud-special.is-empty .hud-special-ammo { color: #ef4444; }
      /* The lock line reserves its row whether or not it has text. A block that grows
         and shrinks under three weapon rows moves the whole column while you read it. */
      .hud-locked {
        min-height: 15px;
        margin-top: 5px;
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #facc15;
      }
      .hud-locked.is-locked { color: #ef4444; }

      /* Only the border pulses: a bar that flashes is harder to read, not more
         urgent, and this has to stay legible at the moment it matters most. */
      #hud.is-critical .hud-gauge:first-child .hud-track { animation: hud-warn 0.75s ease-in-out infinite; }
      @keyframes hud-warn {
        0%, 100% { border-color: #2b3440; }
        50%      { border-color: #ef4444; }
      }
      .hud-down { display: none; color: #ef4444; letter-spacing: 0.08em; }
      #hud.is-down .hud-down { display: block; }
      /* Countdown: the readouts are live, the car is not. Dimmed rather than hidden —
         what you are holding is worth reading before the flag drops. */
      #hud.is-frozen .hud-stack { opacity: 0.45; }

      /* ── round state ─────────────────────────────────────────────────── */
      /* Tweakpane parks top-right and is ~256px wide plus margin, so at 1280 the play
         area is 0..1010 and the clock centres in THAT, not in the viewport. The 270px
         is the one number in this file that tracks the debug panel. */
      .hud-round {
        position: fixed;
        top: 14px;
        left: 0;
        right: 270px;
        margin: 0 auto;
        width: max-content;
        text-align: center;
      }
      .hud-clock {
        font-size: 34px;
        line-height: 1;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        color: #e8edf3;
      }
      .hud-clock.is-urgent { color: #ef4444; }
      .hud-kills {
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #8b95a3;
      }
      .hud-kills.is-behind { color: #facc15; }
      .hud-kills.is-hidden { visibility: hidden; }

      .hud-count {
        position: fixed;
        inset: 0 270px 0 0;
        display: grid;
        place-items: center;
        font-size: 108px;
        line-height: 1;
        font-weight: 600;
        color: #e8edf3;
        opacity: 0;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.85);
      }
      .hud-count.is-beat { animation: hud-beat 1s ease-out forwards; }
      .hud-count.is-go { animation: hud-go 0.8s ease-out forwards; color: #4ade80; }
      @keyframes hud-beat {
        0%   { opacity: 0; transform: scale(1.55); }
        18%  { opacity: 1; transform: scale(1); }
        72%  { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.94); }
      }
      @keyframes hud-go {
        0%   { opacity: 1; transform: scale(0.85); }
        100% { opacity: 0; transform: scale(1.6); }
      }

      .hud-board {
        position: fixed;
        inset: 0 270px 0 0;
        display: none;
        place-items: center;
        align-content: center;
        gap: 18px;
      }
      .hud-board.is-shown { display: grid; }
      .hud-board-title {
        font-size: 38px;
        letter-spacing: 0.12em;
        color: #4ade80;
      }
      .hud-board-title.is-draw { color: #facc15; }
      .hud-board-rows {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 230px;
        padding: 15px 18px;
        background: rgba(9, 12, 16, 0.82);
        border: 1px solid #2b3440;
        border-radius: 3px;
      }
      .hud-board-row {
        display: grid;
        grid-template-columns: 8px 1fr auto;
        align-items: center;
        gap: 0 14px;
        font-size: 14px;
        letter-spacing: 0.12em;
        color: #6b7784;
        font-variant-numeric: tabular-nums;
      }
      .hud-board-row i { height: 8px; border-radius: 1px; opacity: 0.55; }
      .hud-board-row.is-top { color: #e8edf3; }
      .hud-board-row.is-top i { opacity: 1; }
      .hud-again {
        pointer-events: auto;
        margin-top: 14px;
        justify-self: center;
        padding: 8px 18px;
        font: inherit;
        letter-spacing: 0.14em;
        color: #d8dee6;
        background: #11151b;
        border: 1px solid #2b3440;
        border-radius: 3px;
        cursor: pointer;
      }
      .hud-again b { color: #8b95a3; font-weight: 600; margin-left: 6px; }
      .hud-again:hover { border-color: #4ade80; color: #e8edf3; }
      .hud-again:active { transform: translateY(1px); }
      .hud-again:focus-visible { outline: 1px solid #4ade80; outline-offset: 2px; }

      /* ── radar ───────────────────────────────────────────────────────── */
      /* Bottom-left, clear of the debug panel's whole right-hand column. */
      .hud-radar { position: fixed; left: 16px; bottom: 16px; line-height: 0; }

      /* `#keys` moves right to clear the dial: 16 + 192 + 16. */
      #keys { left: 224px; }

      .tp-dfwv { z-index: 10; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="keys">
      <div><b>W&nbsp;S</b> throttle / brake &nbsp;·&nbsp; <b>A&nbsp;D</b> steer</div>
      <div><b>Space</b> handbrake &nbsp;·&nbsp; <b>C</b> look back &nbsp;·&nbsp; <b>R</b> reset</div>
      <div><b>J</b> / left&nbsp;click machine gun &nbsp;·&nbsp; <b>K</b> / right&nbsp;click special &nbsp;·&nbsp; <b>L</b> cycle special</div>
      <div><b>T</b> next target &nbsp;<i>(homing missile only)</i></div>
      <div>gamepad: triggers, left stick, <b>A</b> handbrake, <b>X</b> gun, <b>Y</b> special, <b>RB</b> cycle, <b>LB</b> target</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
