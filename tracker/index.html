<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dead-pedal — progress</title>
    <!--
      Tailwind from the CDN, deliberately.

      This is a local dev tool, not part of the game bundle, and adding a
      PostCSS build step to the game's vite config so a checklist can have
      utility classes would be a worse trade than one script tag. It never
      ships: the game's entry point is index.html at the project root and
      nothing here is imported by it.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-200 antialiased">
    <div id="app" class="mx-auto max-w-4xl px-6 py-10"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
